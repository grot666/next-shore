<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Next Shore · 彼岸 — v2c immersive</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Inter:wght@400;600&family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../v2/engine.css"><style>
/* v2c bold: full-screen sea; question floats over it; chart is a big parallax map */
:root{--paper:#f2e9d8;--sand:#e9d6ae;--sea:#123a40;--ink:#10282c;--accent:#e2932f;--intensity:1;--head:"Fraunces","Noto Serif SC",serif;--line:2px}
body{background:var(--sea)}
.ns2{max-width:none;padding:0}
.top{position:fixed;inset:0 0 auto 0;z-index:5;padding:16px 22px;color:var(--paper)}.mark{color:var(--paper)}.lang button[aria-pressed=true]{border-color:var(--paper)}
.stage{position:fixed;inset:0;margin:0;z-index:0;display:flex;align-items:flex-end}
.scene{height:100vh;width:100%}.scene .water{opacity:1}.scene .wave{stroke:var(--paper);opacity:.35}.scene .gust{stroke:var(--paper)}
.scene .wake path{stroke:var(--paper)}.scene .tower{fill:var(--paper)}.scene .beam{fill:#ffd88a}
.scene .bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(4px)}}
.scene .wave{animation:drift 6s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(-40px)}}
.legend{position:absolute;left:22px;top:auto;bottom:18px;color:var(--paper);flex-direction:column;opacity:.75}.legend i{background:#ffffff30}.legend i:after{background:var(--paper)}
.panel{position:relative;z-index:2;margin:0;min-height:100vh;display:flex;align-items:flex-start;padding:22vh 22px 30px}
.q{background:var(--paper);padding:28px 30px;border-radius:4px;box-shadow:8px 8px 0 var(--ink);max-width:560px}
.q h1{font-weight:700}
[data-view=r] .stage{opacity:.25}[data-view=r] .legend{display:none}.q{width:min(560px,100%)}.scene .hull{fill:var(--sand)}.scene .mast{stroke:var(--paper)}
[data-view=r] .panel{display:block;padding:90px 22px 30px;max-width:1200px;margin:0 auto}
.res{color:var(--paper)}.res .verdict h1{font-weight:700;font-size:clamp(34px,6vw,76px);color:var(--paper)}
.knots i{border-color:var(--paper)}.knots i.on{background:var(--paper)}
.mapwrap{background:var(--paper);color:var(--ink);border-radius:4px;box-shadow:10px 10px 0 #0006}
.harbor-detail,.why,.others{background:var(--paper);color:var(--ink);padding:6px 22px 14px;border-radius:4px;margin-top:18px;border:0;max-width:820px}
.go button{border-color:var(--paper);color:var(--paper)}.q .go button{border-color:var(--ink);color:var(--ink)}.q .go .primary{color:var(--paper)}
.disc{position:relative;z-index:2;color:var(--paper);padding:0 22px 30px;margin:0}
@media(max-width:640px){.panel{padding:16vh 14px 20px}.q{padding:22px 20px;box-shadow:5px 5px 0 var(--ink)}.legend{display:none}}
</style></head>
<body><div id="app"></div><script src="../data.js"></script><script src="../v2/engine.js"></script>
<script>NSV.mount(document.getElementById("app"), {parallax:true});</script></body></html>
