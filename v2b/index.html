<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Next Shore · 彼岸 — v2b illustrated</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;600&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../v2/engine.css"><style>
/* v2b medium: filled illustration, rocking boat, tide rises with progress */
:root{--paper:#f4efe5;--sand:#e3d2b0;--sea:#2f5d62;--ink:#22302f;--accent:#c97a3d;--intensity:1;--head:"Fraunces","Noto Serif SC",serif}
.scene .water{opacity:.9}.scene .wave{stroke:#f4efe5;opacity:.5}.scene .wake path{stroke:#f4efe5}
.scene .bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(3px)}}
.scene .w0,.scene .w2{animation:drift 7s ease-in-out infinite alternate}.scene .w1,.scene .w3{animation:drift 9s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translateX(-26px)}}
.scene .gust{animation:drift 5s ease-in-out infinite alternate}
.stage{background:#e9e2d3;border-radius:6px;padding:20px 0 0;overflow:hidden}.legend{padding:0 16px 10px}
@media(min-width:900px){.panel{display:block}.q{margin-left:4%}}
.chart .grid{stroke:color-mix(in srgb,var(--sea) 10%,transparent)}.mapwrap{background:#ebe4d4;border-radius:6px}
</style></head>
<body><div id="app"></div><script src="../data.js"></script><script src="../v2/engine.js"></script>
<script>NSV.mount(document.getElementById("app"), {});</script></body></html>
