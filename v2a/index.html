<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Next Shore · 彼岸 — v2a minimal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;600&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../v2/engine.css"><style>
/* v2a minimal: line-only sea, lots of air, type leads */
:root{--paper:#fbfaf7;--sand:transparent;--sea:#1d2326;--accent:#b5532f;--intensity:0;--space:1.35}
.ns2{max-width:880px}
.scene .land,.scene .home{fill:none}.scene .water{display:none}.scene .wave{opacity:.35}.scene .wave.w2,.scene .wave.w3{display:none}
.scene .beam{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:2 4}
.scene .crates rect{fill:none}.scene .hull{fill:none;stroke:var(--ink);stroke-width:1.6}
.stage{max-width:880px}.legend{display:none}
.q h1{font-size:clamp(30px,5vw,54px);font-weight:400}.verdict h1{font-weight:400;font-size:clamp(30px,5vw,56px)}
.chart .coast{fill:none}.chart .grid{stroke:transparent}.chart .harbor path:first-child{fill:none}
</style></head>
<body><div id="app"></div><script src="../data.js"></script><script src="../v2/engine.js"></script>
<script>NSV.mount(document.getElementById("app"), {});</script></body></html>
